const b64u8=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const $=id=>document.getElementById(id);let fails=0;
async function unlock(){
  const pw=$('pw').value;if(!pw){$('pw').focus();return;}
  const btn=$('go'),msg=$('msg');btn.disabled=true;msg.className='msg info';msg.textContent='Unlocking…';
  await new Promise(r=>setTimeout(r,30));
  try{
    if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined')
      throw new Error('UNSUPPORTED');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(LOCK.salt),iterations:LOCK.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    let plain;
    try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(LOCK.iv)},key,b64u8(LOCK.ct));}
    catch(e){throw new Error('BADPW');}
    const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    $('pw').value='';
    document.open('text/html','replace');document.write(html);document.close();
  }catch(e){
    btn.disabled=false;
    if(e.message==='BADPW'){
      fails++;msg.className='msg err';msg.textContent='Wrong password.'+(fails>2?' ('+fails+' attempts)':'');
      $('pw').select();
    }else if(e.message==='UNSUPPORTED'){
      msg.className='msg err';msg.textContent='This browser is too old to open the file. Please use a current Chrome or Edge.';
    }else{msg.className='msg err';msg.textContent='Could not open the file: '+e.message;}
  }
}
$('go').addEventListener('click',unlock);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
